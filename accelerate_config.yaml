# accelerate_config.yaml - Configuration for Frontier AMD GPUs
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16  # Use bfloat16 for AMD GPUs
num_machines: 1
num_processes: 8       # 8 GPUs per node
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false