model:
  model_name: vae_kl
  latent_channels: 4
  use_annealing: false
  annealing_shape: cosine
  train_vae_from_checkpoint: false
  train_vae_from_scratch: false
  train_diff_from_checkpoint: false
  train_diff_from_scratch: true
  pretrained_vae_path: null
  pretrained_diff_path: null
training:
  batch_size: 3
  num_epochs: 20
  lr: 0.0001
  weight_decay: 0.001
  beta_recons: 0.5
  recons_loss: mse
  alpha_mse: 2.0
  ema_decay: 0.9999
data:
  data_id: 522
  avg_pooling: false
  topk: 1.0
  data_path: data/
  train_ratio: 0.8
  seed: 42
diffusion:
  diff: true
  latent_diff: false
  diff_epochs: 10
  patch_size: 16
  vit_size: base
inference:
  inference: false
  generate_samples: false
  num_samples: 10
test_pipeline: true
seed: 42
