compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0  # This will be overridden by environment variable
main_process_ip: localhost  # This will be overridden by MASTER_ADDR
main_process_port: 23456
main_training_function: main
mixed_precision: bf16
num_machines: 10
num_processes: 80 # 10 nodes * 8 GPUs per node
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false