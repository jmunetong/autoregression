model:
  model_name: vae_kl
  latent_channels: 4
  latent_diff: false
experiment_type:
  batch_size: 2
  test_pipeline: true
  test_suffix: _test
  num_epochs: 20
  lr: 0.0001
  weight_decay: 0.001
  beta_recons: 0.5
  recons_loss: iwmse
  alpha_mse: 2.0
  ema_decay: 0.9999
  train_vae_from_checkpoint: false
  train_vae_from_scratch: true
  train_diff_from_checkpoint: false
  train_diff_from_scratch: true
  pretrained_vae_path: null
  pretrained_diff_path: null
  use_annealing: true
  annealing_shape: cosine
data:
  data_id: 522
  avg_pooling: true
  topk: 1.0
  data_path: data/
  train_ratio: 0.8
  seed: 42
inference:
  inference: false
  generate_samples: false
  num_samples: 10
